# Every dashboard panel references this fixed uid. The URL resolves both in Kubernetes
# (Service "prometheus") and in docker-compose (service "prometheus").
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s # the scrape interval, so $__rate_interval always spans enough samples
