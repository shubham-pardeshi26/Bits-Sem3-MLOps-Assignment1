apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiorisk-api
  labels:
    app.kubernetes.io/name: cardiorisk-api
spec:
  # No replicas: the HPA (min 2, max 5) owns the count; a fixed one would reset it on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: cardiorisk-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # a new pod must be ready before an old one goes
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cardiorisk-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false # the API never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cardiorisk-api # repository and tag are set by each overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: INFO
          # Peak RSS measured after model load + predictions: ~205 MiB with logistic regression,
          # ~240 MiB with a 500-tree forest, so the limit leaves 2x headroom. The CPU request is
          # small so the HPA reacts to demo load; one uvicorn worker cannot use more than a core.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Up to 2 minutes for imports + model load before liveness takes over.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
