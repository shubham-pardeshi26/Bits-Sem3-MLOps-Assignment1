# The prediction API alone, cluster-agnostic: overlays add the image, exposure and sizing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cardiorisk
labels:
  - pairs:
      app.kubernetes.io/part-of: cardiorisk
    includeTemplates: true # label pods too, but keep selectors minimal (they are immutable)
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
