apiVersion: v1
kind: Service
metadata:
  name: cardiorisk-api
  labels:
    app.kubernetes.io/name: cardiorisk-api
spec:
  type: ClusterIP # overlays switch this to LoadBalancer where the cluster can provide one
  selector:
    app.kubernetes.io/name: cardiorisk-api
  ports:
    - name: http
      port: 8000
      targetPort: http
