[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiorisk"
version = "1.0.0"
description = "Heart disease risk classifier (UCI, 4 sites) with an end-to-end MLOps pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
# Third-party deprecations that only a pin change would fix: Starlette 1.7's TestClient asks for
# httpx2, and MLflow's SQL store uses a deprecated SQLAlchemy loader.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore::sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# MLflow logs a copy of src/cardiorisk with every model; `make format` must never rewrite those.
extend-exclude = ["mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
